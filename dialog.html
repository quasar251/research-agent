<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>研衡 - AI 深度调研</title>
    <style>
        /* ================= 基础变量 ================= */
        :root {
            --bg-color: #F7F4EB;
            --text-main: #1E1E1E;
            --text-muted: #8C8881;
            --primary: #C75B39;
            --primary-light: rgba(199, 91, 57, 0.08);
            --primary-glow: rgba(199, 91, 57, 0.2);
            --border-color: #E8E4D9;
            --white: #FFFFFF;
            --font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            
            --swot-s-bg: #EDF5F0; --swot-s-color: #4A8B63;
            --swot-w-bg: #FDF3F2; --swot-w-color: #C75B39;
            --swot-o-bg: #F0F4F9; --swot-o-color: #5C7DA8;
            --swot-t-bg: #F7F5F0; --swot-t-color: #8C8881;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-family); }

        body {
            background-color: var(--bg-color); color: var(--text-main);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            padding: 40px 20px; overflow-x: hidden; position: relative;
        }

        /* ================= 背景水印 ================= */
        .bg-watermark {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; display: flex; flex-direction: column; justify-content: space-around;
            opacity: 0.02; overflow: hidden;
        }
        .watermark-row { display: flex; white-space: nowrap; font-size: 100px; font-weight: 900; color: #000; transform: rotate(-15deg) scale(1.2); }
        .watermark-row:nth-child(even) { animation: scrollLeft 60s linear infinite; }
        .watermark-row:nth-child(odd) { animation: scrollRight 70s linear infinite; }
        .watermark-row span { margin: 0 50px; }
        @keyframes scrollLeft { 0% { transform: translateX(0) rotate(-15deg) scale(1.2); } 100% { transform: translateX(-50%) rotate(-15deg) scale(1.2); } }
        @keyframes scrollRight { 0% { transform: translateX(-50%) rotate(-15deg) scale(1.2); } 100% { transform: translateX(0) rotate(-15deg) scale(1.2); } }

        /* ================= 核心布局 ================= */
        .app-container {
            position: relative; z-index: 1; width: 100%; max-width: 1100px;
            display: flex; flex-direction: column; gap: 16px;
            transition: max-width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .app-container.reader-mode { max-width: 900px; } /* 阅读模式下变窄，利于长文阅读 */

        /* ================= 头部标题 ================= */
        .header { display: flex; justify-content: space-between; align-items: flex-end; padding: 0 8px; margin-bottom: 8px; }
        .header-left { display: flex; flex-direction: column; gap: 8px; }
        .header-tag { font-size: 11px; color: var(--primary); letter-spacing: 2px; font-weight: 600; text-transform: uppercase; }
        .header-tag.success { color: #4A8B63; }
        .header-title { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        
        /* 隐藏的返回按钮（在阅读模式显示） */
        .back-btn { 
            display: none; background: transparent; border: 1px solid var(--border-color); 
            padding: 6px 16px; border-radius: 8px; font-size: 13px; color: var(--text-muted); 
            cursor: pointer; transition: all 0.2s; align-items: center; gap: 6px;
        }
        .back-btn:hover { background: var(--white); color: var(--text-main); border-color: #D1CCC1; }
        .app-container.reader-mode .back-btn { display: flex; }

        /* ================= 玻璃拟态主卡片 ================= */
        .main-card {
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.02);
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* 顶部全局进度条 */
        .global-progress { width: 100%; height: 3px; background-color: var(--border-color); position: relative; }
        .global-progress-fill { position: absolute; top: 0; left: 0; height: 100%; width: 0%; background: linear-gradient(90deg, #D87453, var(--primary)); transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1); }

        /* 卡片内容区 */
        .card-body { display: flex; height: 620px; transition: height 0.6s ease; }
        
        /* 阅读模式下取消固定高度，随内容撑开 */
        .app-container.reader-mode .card-body { height: auto; min-height: 620px; }

        /* ================= 左侧：调研步骤 ================= */
        .sidebar {
            width: 300px; flex-shrink: 0; background-color: rgba(247, 244, 235, 0.4);
            border-right: 1px solid var(--border-color); padding: 32px 24px;
            display: flex; flex-direction: column; position: relative;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        /* 阅读模式下收起侧边栏 */
        .app-container.reader-mode .sidebar { width: 0; padding: 32px 0; border-right-color: transparent; opacity: 0; }

        .sidebar-title { font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 24px; letter-spacing: 1px; white-space: nowrap; }
        .steps-container { display: flex; flex-direction: column; gap: 24px; position: relative; min-width: 250px; }
        .steps-container::before { content: ''; position: absolute; top: 10px; bottom: 20px; left: 9px; width: 2px; background-color: var(--border-color); z-index: 0; }

        .step-item { display: flex; gap: 16px; position: relative; z-index: 1; transition: all 0.3s ease; }
        .step-icon { width: 20px; height: 20px; border-radius: 50%; background-color: var(--white); border: 2px solid var(--border-color); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.3s ease; margin-top: 2px; }
        .step-content { display: flex; flex-direction: column; gap: 4px; }
        .step-name { font-size: 14px; font-weight: 500; color: var(--text-muted); transition: color 0.3s; white-space: nowrap; }
        .step-status-text { font-size: 12px; color: #A9A5A0; line-height: 1.5; opacity: 0; height: 0; overflow: hidden; transition: all 0.3s ease; white-space: nowrap; }

        .step-item.pending .step-icon { border-color: var(--border-color); }
        .step-item.active .step-icon { border-color: var(--primary); background-color: var(--primary-light); box-shadow: 0 0 0 4px var(--primary-glow); }
        .step-item.active .step-icon::after { content: ''; width: 8px; height: 8px; background-color: var(--primary); border-radius: 50%; animation: pulse 1.5s infinite; }
        .step-item.active .step-name { color: var(--primary); font-weight: 600; }
        .step-item.active .step-status-text { opacity: 1; height: auto; margin-top: 4px; }
        
        .step-item.waiting .step-icon { border-color: #E6A23C; background-color: #FDF6EC; box-shadow: 0 0 0 4px rgba(230, 162, 60, 0.15); }
        .step-item.waiting .step-icon::after { content: '!'; color: #E6A23C; font-weight: bold; font-size: 10px; }
        .step-item.waiting .step-name { color: #E6A23C; font-weight: 600; }
        .step-item.waiting .step-status-text { opacity: 1; height: auto; margin-top: 4px; color: #E6A23C; }

        .step-item.completed .step-icon { border-color: var(--primary); background-color: var(--primary); }
        .step-item.completed .step-icon svg { display: block; }
        .step-item.completed .step-name { color: var(--text-main); }
        .step-item.completed .step-status-text { opacity: 1; height: auto; margin-top: 4px; color: var(--text-muted); }
        .step-icon svg { display: none; }

        @keyframes pulse { 0% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(0.8); opacity: 0.5; } }

        /* ================= 右侧：文档渲染区 ================= */
        .document-area { 
            flex: 1; padding: 40px; overflow-y: auto; position: relative; scroll-behavior: smooth; background-color: var(--white);
            transition: padding 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .app-container.reader-mode .document-area { padding: 60px 80px; } /* 阅读模式增加留白 */

        .document-area::-webkit-scrollbar { width: 6px; }
        .document-area::-webkit-scrollbar-track { background: transparent; }
        .document-area::-webkit-scrollbar-thumb { background-color: #E0DDD5; border-radius: 99px; }

        .doc-content { display: flex; flex-direction: column; gap: 20px; opacity: 0; animation: fadeInDoc 0.6s forwards; margin-bottom: 24px; }
        @keyframes fadeInDoc { to { opacity: 1; } }

        .doc-h1 { font-size: 24px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; }
        .doc-h2 { font-size: 18px; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 8px; margin-top: 8px; }
        .doc-h2::before { content: ''; display: inline-block; width: 4px; height: 16px; background-color: var(--primary); border-radius: 2px; }
        .doc-text { font-size: 14px; line-height: 1.8; color: var(--text-muted); }
        .app-container.reader-mode .doc-text { font-size: 15px; } /* 阅读模式字号微调 */

        /* 骨架屏 */
        .skeleton-group { display: flex; flex-direction: column; gap: 10px; }
        .skeleton-line { height: 12px; background-color: #F0EDE6; border-radius: 4px; position: relative; overflow: hidden; }
        .skeleton-line::after { content: ''; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent); transform: translateX(-100%); animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
        .w-100 { width: 100%; } .w-80 { width: 80%; } .w-60 { width: 60%; }

        /* 图表 & SWOT */
        .chart-box { background: #FCFAF8; border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-top: 8px; }
        .chart-title { font-size: 13px; font-weight: 600; margin-bottom: 16px; color: var(--text-main); }
        .bar-chart { display: flex; flex-direction: column; gap: 12px; }
        .bar-item { display: flex; align-items: center; gap: 12px; font-size: 12px; }
        .bar-label { width: 80px; text-align: right; color: var(--text-muted); }
        .bar-track { flex: 1; height: 10px; background: #EDEBE6; border-radius: 99px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0; border-radius: 99px; transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .bar-value { width: 40px; font-weight: 600; color: var(--text-main); font-family: monospace; }
        .fill-orange { background: var(--primary); } .fill-blue { background: #5C7DA8; } .fill-green { background: #4A8B63; }

        .swot-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
        .swot-card { padding: 16px; border-radius: 12px; border: 1px solid transparent; display: flex; flex-direction: column; gap: 8px; }
        .swot-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .swot-list { font-size: 12px; line-height: 1.6; padding-left: 14px; }
        .swot-s { background-color: var(--swot-s-bg); color: var(--swot-s-color); border-color: rgba(74,139,99,0.1); }
        .swot-w { background-color: var(--swot-w-bg); color: var(--swot-w-color); border-color: rgba(199,91,57,0.1); }
        .swot-o { background-color: var(--swot-o-bg); color: var(--swot-o-color); border-color: rgba(92,125,168,0.1); }
        .swot-t { background-color: var(--swot-t-bg); color: var(--swot-t-color); border-color: rgba(140,136,129,0.1); }

        /* ================= 底部交互面板 ================= */
        .interaction-panel {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color); padding: 20px 32px;
            display: flex; flex-direction: column; gap: 12px;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10; box-shadow: 0 -10px 30px rgba(0,0,0,0.03);
        }
        .interaction-panel.show { transform: translateY(0); }

        .interaction-header { display: flex; justify-content: space-between; align-items: center; }
        .interaction-title { font-size: 14px; font-weight: 600; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .interaction-title::before { content: '✦'; }

        .interaction-input-group { display: flex; gap: 12px; }
        .interaction-input {
            flex: 1; padding: 10px 16px; border: 1px solid var(--border-color); border-radius: 8px;
            font-size: 13px; outline: none; background: var(--bg-color); transition: all 0.2s;
        }
        .interaction-input:focus { border-color: var(--primary); background: var(--white); box-shadow: 0 0 0 3px var(--primary-glow); }

        .btn-confirm { padding: 10px 24px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; background-color: var(--primary); color: var(--white); }
        .btn-confirm:hover { background-color: #B34D2D; }
        .btn-retry { padding: 10px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: 1px solid var(--border-color); background-color: transparent; color: var(--text-main); }
        .btn-retry:hover { background-color: var(--bg-color); }

        .card-footer { padding: 20px 32px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; background-color: rgba(255, 255, 255, 0.5); transition: all 0.4s ease; }
        .btn { padding: 12px 28px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; border: none; display: flex; align-items: center; gap: 8px; }
        .btn-disabled { background-color: var(--border-color); color: #A9A5A0; cursor: not-allowed; }
        .btn-ready { background-color: var(--primary); color: var(--white); box-shadow: 0 4px 12px var(--primary-glow); }
        .btn-ready:hover { background-color: #B34D2D; transform: translateY(-1px); }

        /* 阅读模式下的操作栏替换 */
        .app-container.reader-mode .card-footer { display: none; }

        /* 阅读模式特有元素 */
        .reader-toolbar {
            display: none;
            padding: 16px 80px;
            background: rgba(247, 244, 235, 0.6);
            border-bottom: 1px solid var(--border-color);
            justify-content: space-between;
            align-items: center;
        }
        .app-container.reader-mode .reader-toolbar { display: flex; }
        
        .toolbar-title { font-size: 13px; color: var(--text-muted); font-weight: 500; }
        .toolbar-actions { display: flex; gap: 12px; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 16px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
        .btn-outline:hover { background: var(--white); }
    </style>
</head>
<body>

    <div class="bg-watermark">
        <div class="watermark-row"><span>人形机器人</span><span>钙钛矿光伏</span><span>AI Agent 行业</span><span>储能</span><span>出海</span></div>
        <div class="watermark-row"><span>宠物经济</span><span>预制菜</span><span>咖啡连锁</span><span>餐饮</span><span>工程机械</span></div>
        <div class="watermark-row"><span>钙钛矿光伏</span><span>储能</span><span>出海</span><span>AI Agent 行业</span><span>银发经济</span></div>
    </div>

    <main class="app-container" id="appContainer">
        <header class="header">
            <div class="header-left">
                <div class="header-tag" id="headerTag">Deep Research</div>
                <div class="header-title" id="headerTitle">正在深度调研：<span>AI Agent 行业</span></div>
            </div>
            <!-- 返回按钮 (隐藏/显示由 CSS 控制) -->
            <button class="back-btn" onclick="exitReaderMode()">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                返回调研过程
            </button>
        </header>

        <div class="main-card">
            <div class="global-progress">
                <div class="global-progress-fill" id="globalBar"></div>
            </div>

            <!-- 阅读模式的工具栏 -->
            <div class="reader-toolbar">
                <div class="toolbar-title">研衡 AI 深度调研报告 · 生成于 2024年</div>
                <div class="toolbar-actions">
                    <button class="btn-outline" onclick="alert('模拟导出 PDF')">导出 PDF</button>
                    <button class="btn-outline" onclick="alert('模拟分享链接')">分享报告</button>
                </div>
            </div>

            <div class="card-body">
                <!-- 左侧 -->
                <div class="sidebar">
                    <div class="sidebar-title">研衡思考过程</div>
                    <div class="steps-container">
                        <div class="step-item pending" id="step-0">
                            <div class="step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="10" height="10"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                            <div class="step-content"><div class="step-name">拆解问题与大纲</div><div class="step-status-text">正在构建调研框架...</div></div>
                        </div>
                        <div class="step-item pending" id="step-1">
                            <div class="step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="10" height="10"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                            <div class="step-content"><div class="step-name">全网数据检索</div><div class="step-status-text">正在抓取多源数据库...</div></div>
                        </div>
                        <div class="step-item pending" id="step-2">
                            <div class="step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="10" height="10"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                            <div class="step-content"><div class="step-name">深度交叉验证</div><div class="step-status-text">正在进行 SWOT 分析...</div></div>
                        </div>
                        <div class="step-item pending" id="step-3">
                            <div class="step-icon"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" width="10" height="10"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
                            <div class="step-content"><div class="step-name">最终报告合成</div><div class="step-status-text">输出结构化洞察...</div></div>
                        </div>
                    </div>
                </div>

                <!-- 右侧文档区 -->
                <div class="document-area" id="docArea"></div>
            </div>

            <!-- 交互确认面板 -->
            <div class="interaction-panel" id="confirmPanel">
                <div class="interaction-header" id="confirmHint"></div>
                <div class="interaction-input-group">
                    <input type="text" class="interaction-input" id="feedbackInput" placeholder="对当前结果不满意？输入修改意见（例如：增加海外市场分析、关注技术壁垒...）">
                    <button class="btn-retry" onclick="handleRetry()">修改重生成</button>
                    <button class="btn-confirm" onclick="handleConfirm()">确认，继续下一步</button>
                </div>
            </div>

            <div class="card-footer">
                <button class="btn btn-disabled" id="actionBtn">正在生成报告...</button>
            </div>
        </div>
    </main>

    <script>
        const appContainer = document.getElementById('appContainer');
        const headerTag = document.getElementById('headerTag');
        const headerTitle = document.getElementById('headerTitle');
        const globalBar = document.getElementById('globalBar');
        const docArea = document.getElementById('docArea');
        const actionBtn = document.getElementById('actionBtn');
        const confirmPanel = document.getElementById('confirmPanel');
        const confirmHint = document.getElementById('confirmHint');
        const feedbackInput = document.getElementById('feedbackInput');

        // 核心数据
        const flowData = [
            {
                percent: 20, stepId: 'step-0', needConfirm: true, hint: "大纲已生成，请确认是否需要补充研究方向？",
                loadingUI: `<div class="doc-content" id="content-step-0"><div class="doc-h1">AI Agent 行业深度调研报告</div><div class="doc-h2">一、 行业概述与核心驱动力</div><div class="skeleton-group"><div class="skeleton-line w-100"></div><div class="skeleton-line w-80"></div></div></div>`,
                finalUI: `<div class="doc-content" id="content-step-0"><div class="doc-h1">AI Agent 行业深度调研报告</div><div class="doc-h2">一、 行业概述与核心驱动力</div><div class="doc-text">AI Agent（人工智能代理）是指能够感知环境、进行决策并采取行动以实现特定目标的智能实体。当前行业的核心驱动力主要来自于大语言模型（LLM）推理能力的跃升，以及企业对于自动化降本增效的刚性需求。随着底层模型能力的泛化，Agent 正从单一的对话工具向具备复杂任务规划能力的生产力工具演进。</div></div>`
            },
            {
                percent: 50, stepId: 'step-1', needConfirm: true, hint: "市场数据图表已生成，您可以指定关注的细分赛道，或直接确认继续。",
                loadingUI: `<div class="doc-content" id="content-step-1"><div class="doc-text">研衡正在提取目前 AI Agent 市场的份额占比结构...</div><div class="skeleton-group"><div class="skeleton-line w-100"></div><div class="skeleton-line w-60"></div></div></div>`,
                finalUI: `<div class="doc-content" id="content-step-1"><div class="doc-text">研衡已提取出目前 AI Agent 市场的份额占比结构，呈现向头部集中的趋势：</div><div class="chart-box"><div class="chart-title">2024 Q2 市场份额分布预测 (%)</div><div class="bar-chart"><div class="bar-item"><div class="bar-label">基础大模型</div><div class="bar-track"><div class="bar-fill fill-orange" style="width: 0;" data-width="45%"></div></div><div class="bar-value">45%</div></div><div class="bar-item"><div class="bar-label">Agent 平台</div><div class="bar-track"><div class="bar-fill fill-blue" style="width: 0;" data-width="30%"></div></div><div class="bar-value">30%</div></div><div class="bar-item"><div class="bar-label">垂直应用</div><div class="bar-track"><div class="bar-fill fill-green" style="width: 0;" data-width="25%"></div></div><div class="bar-value">25%</div></div></div></div></div>`
            },
            {
                percent: 80, stepId: 'step-2', needConfirm: false,
                loadingUI: `<div class="doc-content" id="content-step-2"><div class="doc-h2">二、 研衡 SWOT 核心战略分析</div><div class="skeleton-group"><div class="skeleton-line w-100"></div><div class="skeleton-line w-80"></div></div></div>`,
                finalUI: `<div class="doc-content" id="content-step-2"><div class="doc-h2">二、 研衡 SWOT 核心战略分析</div><div class="swot-grid"><div class="swot-card swot-s"><div class="swot-title">S - 优势 (Strengths)</div><ul class="swot-list"><li>大模型推理能力突破</li><li>自动化任务闭环度高</li></ul></div><div class="swot-card swot-w"><div class="swot-title">W - 劣势 (Weaknesses)</div><ul class="swot-list"><li>多模态融合有延迟</li><li>私有化部署成本高</li></ul></div><div class="swot-card swot-o"><div class="swot-title">O - 机会 (Opportunities)</div><ul class="swot-list"><li>企业数字化转型刚需</li><li>API 成本持续下降</li></ul></div><div class="swot-card swot-t"><div class="swot-title">T - 威胁 (Threats)</div><ul class="swot-list"><li>数据隐私与合规监管</li><li>开源框架快速追赶</li></ul></div></div></div>`
            },
            {
                percent: 100, stepId: 'step-3', needConfirm: false,
                loadingUI: `<div class="doc-content" id="content-step-3"><div class="doc-h2">三、 综合洞察与建议</div><div class="skeleton-group"><div class="skeleton-line w-100"></div><div class="skeleton-line w-100"></div></div></div>`,
                finalUI: `<div class="doc-content" id="content-step-3"><div class="doc-h2">三、 综合洞察与建议</div><div class="doc-text" style="background-color: #FCFAF5; padding: 16px; border-radius: 12px; border-left: 3px solid var(--primary);"><strong>研衡结论：</strong>AI Agent 行业正处于爆发前夜。短期内，底层大模型厂商依然占据利润大头，但中长期来看，具备行业 Know-How 的应用层平台将依托 O（机会）与 S（优势）的结合，建立强壁垒。建议重点关注能够解决企业实际流程痛点的垂直 Agent 产品。</div></div>`
            }
        ];

        let currentIndex = 0;
        let isWaiting = false;

        function animateCharts() {
            setTimeout(() => {
                const newBars = docArea.querySelectorAll('.bar-fill');
                newBars.forEach(bar => {
                    if (bar.style.width === '0px' || bar.style.width === '0%') {
                        bar.style.width = bar.getAttribute('data-width');
                    }
                });
            }, 100);
        }

        function scrollToBottom() { docArea.scrollTo({ top: docArea.scrollHeight, behavior: 'smooth' }); }

        function replaceUI(index, uiType) {
            const data = flowData[index];
            const targetId = `content-step-${index}`;
            const oldElement = document.getElementById(targetId);
            const newHtml = uiType === 'final' ? data.finalUI : data.loadingUI;
            if (oldElement && newHtml) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = newHtml;
                oldElement.replaceWith(tempDiv.firstElementChild);
            }
        }

        function executeStep() {
            if (currentIndex >= flowData.length) {
                // 🌟 流程全部结束的最终状态设置
                actionBtn.className = 'btn btn-ready';
                actionBtn.innerHTML = '查看完整报告 ➤';
                actionBtn.onclick = enterReaderMode;
                return;
            }

            const data = flowData[currentIndex];
            globalBar.style.width = `${data.percent}%`;

            const currentStep = document.getElementById(data.stepId);
            currentStep.classList.remove('pending');
            currentStep.classList.add('active');

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = data.loadingUI;
            while (tempDiv.firstChild) docArea.appendChild(tempDiv.firstChild);
            scrollToBottom();

            if (data.loadingUI.includes('chart-box')) animateCharts();

            if (data.needConfirm) {
                isWaiting = true;
                currentStep.classList.remove('active');
                currentStep.classList.add('waiting');
                currentStep.querySelector('.step-status-text').innerText = '等待您的确认...';
                confirmHint.innerHTML = `<div class="interaction-title">${data.hint}</div>`;
                confirmPanel.classList.add('show');
            } else {
                setTimeout(() => {
                    replaceUI(currentIndex, 'final');
                    if (data.finalUI.includes('chart-box')) animateCharts();
                    scrollToBottom();
                    completeCurrentStepAndNext();
                }, 1500);
            }
        }

        function completeCurrentStepAndNext() {
            const data = flowData[currentIndex];
            const currentStep = document.getElementById(data.stepId);
            currentStep.classList.remove('active', 'waiting');
            currentStep.classList.add('completed');
            currentStep.querySelector('.step-status-text').innerText = '已完成';
            currentIndex++;
            setTimeout(executeStep, 800); 
        }

        function handleConfirm() {
            if (!isWaiting) return;
            confirmPanel.classList.remove('show');
            isWaiting = false;
            replaceUI(currentIndex, 'final');
            if (flowData[currentIndex].finalUI.includes('chart-box')) animateCharts();
            scrollToBottom();
            completeCurrentStepAndNext();
        }

        function handleRetry() {
            if (!isWaiting) return;
            const feedback = feedbackInput.value.trim();
            const data = flowData[currentIndex];
            const currentStep = document.getElementById(data.stepId);
            
            confirmPanel.classList.remove('show');
            isWaiting = false;
            feedbackInput.value = ''; 
            currentStep.classList.remove('waiting');
            currentStep.classList.add('active');
            currentStep.querySelector('.step-status-text').innerText = '正在根据您的反馈重新生成...';

            const targetId = `content-step-${currentIndex}`;
            const oldElement = document.getElementById(targetId);
            if (oldElement) {
                const loadingHtml = `<div class="doc-content" id="${targetId}"><div class="doc-text" style="color: var(--primary); font-size: 13px; border-left: 2px solid var(--primary); padding-left: 10px; margin-bottom: 12px;"><em>收到您的指令：${feedback || '重新评估当前内容'}。研衡正在调整模型输出...</em></div><div class="skeleton-group"><div class="skeleton-line w-100"></div><div class="skeleton-line w-60"></div></div></div>`;
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = loadingHtml;
                oldElement.replaceWith(tempDiv.firstElementChild);
            }
            scrollToBottom();

            setTimeout(() => {
                currentStep.classList.remove('active');
                currentStep.classList.add('waiting');
                currentStep.querySelector('.step-status-text').innerText = '等待您的确认...';
                replaceUI(currentIndex, 'final');
                if (data.finalUI.includes('chart-box')) animateCharts();
                scrollToBottom();
                confirmPanel.classList.add('show');
                isWaiting = true;
            }, 2000);
        }

        // ================= 🌟 核心：进入阅读模式 =================
        function enterReaderMode() {
            // 1. 给容器加上 reader-mode 类，触发 CSS 过渡动画
            appContainer.classList.add('reader-mode');
            
            // 2. 修改顶部标题状态
            headerTag.innerText = "Report Completed";
            headerTag.classList.add('success');
            headerTitle.innerHTML = "AI Agent 行业深度调研报告 <span style='color: var(--primary); font-size: 16px; margin-left: 8px;'>✓ 已完成</span>";

            // 3. 隐藏过程残留的交互元素
            document.querySelectorAll('.cursor').forEach(el => el.remove()); // 移除闪烁光标
            confirmPanel.classList.remove('show');
            
            // 4. 阅读模式排版微调（重新排列文档）
            // 为了美观，可以稍微平滑滚动到顶部
            setTimeout(() => {
                docArea.scrollTo({ top: 0, behavior: 'smooth' });
            }, 300);
        }

        // ================= 🌟 核心：退出阅读模式 =================
        function exitReaderMode() {
            // 恢复容器的类
            appContainer.classList.remove('reader-mode');
            
            // 恢复标题
            headerTag.innerText = "Deep Research";
            headerTag.classList.remove('success');
            headerTitle.innerHTML = "正在深度调研：<span>AI Agent 行业</span>";

            // 滚动到底部
            setTimeout(() => {
                scrollToBottom();
            }, 300);
        }

        // 启动
        window.onload = () => {
            setTimeout(executeStep, 500);
        };
    </script>
</body>
</html>
